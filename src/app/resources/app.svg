    <path d="M21.640538 7.37445L15.62305 0V3.77445C15.62305 4.89271 15.62305 5.45184 15.772864 5.89289C15.972616 6.48096 16.35572 6.94818 16.837962 7.19176C17.199582 7.37445 17.658044 7.37445 18.57505 7.37445H21.640538Z" fill="white" fill-opacity=".7" stroke="#008AC4" stroke-width="0.29" stroke-linejoin="round"/>

    <!-- 2 条半横线 -->
    <path d="M6.15 10.3H17.22" stroke="white" stroke-width="1.6"/>
    <path d="M6.15 15.3H17.22" stroke="white" stroke-width="1.6"/>
    <path d="M6.15 20.3H13.94" stroke="white" stroke-width="1.6"/>
  </g>

  <!-- ================= 悬浮的 M（无白底牌） ================= -->
  <g filter="url(#mShadow)">
    <!-- M 图形：实心渐变 + 细描边，整体下移 0.60，高度拉长到 13.44 -->
    <g transform="translate(1.62, 6.26)">
      <path d="M 0,13.44 L 0,0 L 4.032,0 L 8.064,7.11529 L 12.096,0 L 16.128,0 L 16.128,13.44 L 12.096,13.44 L 12.096,6.32471 L 8.064,13.44 L 4.032,6.32471 L 4.032,13.44 Z"
            fill="url(#mGradV)" stroke="#9A3B00" stroke-width="0.30"
            stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
