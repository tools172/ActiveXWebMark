<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-0.25 -0.25 28.5 28.5" fill="none">
  <!-- ActiveXWebMark 应用图标源文件。
       记事本 translate x = 5.56（外接框 0.80~27.20 居中），2 条半横线 y = 10.3 / 15.3 / 20.3；
       蓝色纸张 #00B8FF、折角加 #008AC4、0.29 单位细边框（参考 Word/Excel 文档图标）。
       纸张路径已把 scale(0.82, 1) 的横向缩放烘焙进坐标，描边四边等宽；
       viewBox 四周留 0.25 单位余量，避免上下描边被画布裁掉。
       M 标记：无白色底牌（直接叠在记事本/透明背景上），实心加深橘黄渐变
       #FFC04D → #FF9A1F → #EE7400 → #C95300，外加 0.30 单位深棕描边提升同色背景下的辨识度；
       高 13.44（原 9.36），整组下移至 y = 6.26；缩放已烘焙进路径，描边等宽。
       app.ico 由本文件按 16/24/32/48/64/128/256 渲染生成。 -->
  <defs>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.8" dy="1.2" stdDeviation="1" flood-color="#0A2E66" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="mGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC04D"/>
      <stop offset="0.34" stop-color="#FF9A1F"/>
      <stop offset="0.67" stop-color="#EE7400"/>
      <stop offset="1" stop-color="#C95300"/>
    </linearGradient>
  </defs>

  <!-- ================= 记事本打底 ================= -->
  <g transform="translate(5.56, 0)">
