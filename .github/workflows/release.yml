name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build & package installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + vcpkg)
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --config Release

      - name: Test
        run: ctest --preset ci

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "WIX_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Resolve executable path
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "build\ci\src\app\Release\ActiveXWebMark.exe"
          "AWM_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          wix build -o "dist/ActiveXWebMark-$v.msi" packaging/wix/ActiveXWebMark.wxs

      - name: Build Setup.exe (NSIS)
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = "makensis" }
          $v = "${{ steps.version.outputs.version }}"
          & $nsis /DVERSION=$v /DEXE="$env:AWM_EXE" packaging/nsis/ActiveXWebMark.nsi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ActiveXWebMark-*.msi
            dist/ActiveXWebMark-*-setup.exe
