name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Upstream has no Node 24 release yet (v1.13.0 still declares node20);
      # the runner forces it onto Node 24, which currently works.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + vcpkg)
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci
